name: Temporary NOVUS call dialler self-test
on:
  push:
    branches:
      - feature/novus-call-dialler-v0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check changed server files
        run: |
          node --check lib/operator-calls.mjs
          node --check lib/call-intelligence.mjs
          node --check api/novus/personalisation.js
          node --check api/novus/webhooks/voice-recording.js
          node -e "const fs=require('fs');const h=fs.readFileSync('novus/operator.html','utf8');const m=h.match(/<script>([\\s\\S]*)<\\/script>/);if(!m)throw new Error('operator script missing');fs.writeFileSync('/tmp/operator-script.js',m[1]);"
          node --check /tmp/operator-script.js
      - name: Run dialler self-test
        run: node scripts/novus-call-dialler-selftest.mjs
